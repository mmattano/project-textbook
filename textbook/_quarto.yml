project:
  type: book
  output-dir: _book

book:
  title: "EuBIC-MS Textbook"
  author: "EuBIC-MS"
  chapters:
    - index.qmd
    - guidelines.qmd
    - part: "Mass Spectrometry Fundamentals"
      chapters:
        - introduction.qmd
    - part: "Proteomics"
      chapters:
        - data-preprocessing.qmd
        - identification-search.qmd
        - quantification.qmd
        - post-quantification-processing.qmd
        - significance-analysis.qmd
    - part: metabolomics/index.qmd
      chapters:
        - metabolomics/feature-detection.qmd
        - metabolomics/annotation.qmd
        - metabolomics/databases-standards.qmd
    - part: stable-isotope-labeling/index.qmd
      chapters:
        - stable-isotope-labeling/labeling-strategies.qmd
        - stable-isotope-labeling/flux-calculations.qmd
    - part: "Tools and Best Practices"
      chapters:
        - machine-learning-ai.qmd
        - workflows-reproducibility.qmd
        - programming-tools.qmd
        - format-usability-preferences.qmd
  appendices:
    - glossary.qmd
    - authors.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
    css: styles.css
  pdf:
    documentclass: scrreprt
